name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # This line fixes the push problem

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mohan-b-dev
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        run: |
          git config user.name "Mohan-b-dev"
          git config user.email "mohangokul515@gmail.com"
          git checkout --orphan output
          git --work-tree dist add --all
          git --work-tree dist commit -m "Update snake"
          git push -f origin output
